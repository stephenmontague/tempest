# =============================================================================
# Tempest - Docker Compose
# =============================================================================
# Runtime topology:
#   postgres      - single shared 'tempest' database
#   tempest-api   - one REST/CRUD API for all domains (owns Flyway migrations)
#   *-worker      - four standalone Temporal workers (ims/oms/wms/sms), each on its
#                   own task queue, connecting to an EXTERNAL Temporal cluster
#   ui            - Next.js frontend + Temporal client (BFF)
#
# Temporal is NOT run here. Point the workers + UI at your own Temporal (1.31.1) on the
# host via host.docker.internal:7233, with a 'tempest' namespace already registered.
#
# Usage:
#   ./demo.sh up      - Build + start everything
#   ./demo.sh kill X  - Kill a worker (ims, oms, wms, sms) to demo Temporal resilience
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: tempest-postgres
    # One instance backs tempest-api + all four worker Hikari pools.
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: tempest
      POSTGRES_PASSWORD: tempest
      POSTGRES_DB: tempest
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tempest"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: "no"

  # ---------------------------------------------------------------------------
  # Unified REST/CRUD API (all domains, single DB) — owns Flyway migrations
  # ---------------------------------------------------------------------------
  tempest-api:
    build:
      context: ./tempest-api
      dockerfile: Dockerfile
    container_name: tempest-api
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USERNAME: tempest
      DB_PASSWORD: tempest
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tempest
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: "no"

  # ---------------------------------------------------------------------------
  # Temporal workers (standalone apps). No published ports. Connect to the
  # external Temporal cluster on the host. Wait for tempest-api (schema) first.
  # ---------------------------------------------------------------------------
  ims-worker:
    build:
      context: ./ims-worker
      dockerfile: Dockerfile
    container_name: tempest-ims-worker
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USERNAME: tempest
      DB_PASSWORD: tempest
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tempest
      TEMPORAL_ADDRESS: host.docker.internal:7233
      TEMPORAL_NAMESPACE: tempest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      tempest-api:
        condition: service_healthy
    restart: "no"

  oms-worker:
    build:
      context: ./oms-worker
      dockerfile: Dockerfile
    container_name: tempest-oms-worker
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USERNAME: tempest
      DB_PASSWORD: tempest
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tempest
      TEMPORAL_ADDRESS: host.docker.internal:7233
      TEMPORAL_NAMESPACE: tempest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      tempest-api:
        condition: service_healthy
    restart: "no"

  wms-worker:
    build:
      context: ./wms-worker
      dockerfile: Dockerfile
    container_name: tempest-wms-worker
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USERNAME: tempest
      DB_PASSWORD: tempest
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tempest
      TEMPORAL_ADDRESS: host.docker.internal:7233
      TEMPORAL_NAMESPACE: tempest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      tempest-api:
        condition: service_healthy
    restart: "no"

  sms-worker:
    build:
      context: ./sms-worker
      dockerfile: Dockerfile
    container_name: tempest-sms-worker
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USERNAME: tempest
      DB_PASSWORD: tempest
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tempest
      TEMPORAL_ADDRESS: host.docker.internal:7233
      TEMPORAL_NAMESPACE: tempest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      tempest-api:
        condition: service_healthy
    restart: "no"

  # ---------------------------------------------------------------------------
  # Frontend + Temporal client (BFF). Calls the single API for CRUD; talks to
  # the external Temporal directly for workflow start/signal/query.
  # ---------------------------------------------------------------------------
  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: tempest-ui
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      AUTH_DEV_BYPASS: "true"
      AUTH_SECRET: dev-secret-for-docker-demo
      # All CRUD goes to the single API (paths are distinct per domain)
      OMS_URL: http://tempest-api:8081
      IMS_URL: http://tempest-api:8081
      WMS_URL: http://tempest-api:8081
      SMS_URL: http://tempest-api:8081
      # Temporal client -> external cluster; deep links -> your Temporal UI
      TEMPORAL_ADDRESS: host.docker.internal:7233
      TEMPORAL_NAMESPACE: tempest
      TEMPORAL_UI_BASE_URL: http://localhost:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - tempest-api
    restart: "no"

volumes:
  postgres_data:
