# =============================================================================
# Tempest WMS - Docker Compose (Self-contained with Temporal)
# =============================================================================
# This setup includes everything needed to run the full Tempest WMS demo,
# including a local Temporal cluster.
#
# Architecture:
#   - Each service runs in two modes via the same JAR:
#     1. API mode (TEMPORAL_WORKER_ENABLED=false) - serves REST endpoints
#     2. Worker mode (WEB-APPLICATION-TYPE=none) - runs activity worker
#   - A standalone workflow-worker handles all workflow execution
#
# Usage:
#   ./demo.sh up      - Start all services
#   ./demo.sh kill X  - Kill a specific service (ims, oms, wms, sms)
#   ./demo.sh start X - Restart a killed service
#
# For local development with an external Temporal cluster:
#   Create a docker-compose.override.yml file to customize the setup.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------

  postgres:
    image: postgres:16-alpine
    container_name: tempest-postgres
    command: postgres -c max_connections=300
    environment:
      POSTGRES_USER: tempest
      POSTGRES_PASSWORD: tempest
      POSTGRES_DB: tempest
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tempest"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: "no"

  # ---------------------------------------------------------------------------
  # Temporal Cluster (for workflow orchestration)
  # ---------------------------------------------------------------------------

  temporal:
    image: temporalio/auto-setup:1.24.2
    container_name: tempest-temporal
    ports:
      - "7233:7233"
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=tempest
      - POSTGRES_PWD=tempest
      - POSTGRES_SEEDS=postgres
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: "no"

  temporal-ui:
    image: temporalio/ui:2.26.2
    container_name: tempest-temporal-ui
    ports:
      - "8080:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000,http://localhost:3001
    depends_on:
      - temporal
    restart: "no"

  temporal-admin-tools:
    image: temporalio/admin-tools:latest
    container_name: tempest-temporal-admin
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    depends_on:
      temporal:
        condition: service_healthy
    # Create the tempest namespace on startup
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 10
        temporal operator namespace describe tempest --address temporal:7233 || \
        temporal operator namespace create tempest --address temporal:7233 --retention 30d
        echo "Namespace 'tempest' is ready"
        # Keep container running for debugging if needed
        tail -f /dev/null
    restart: "no"

  # ---------------------------------------------------------------------------
  # Temporal Workers
  # ---------------------------------------------------------------------------

  # Standalone workflow worker - executes all workflow logic, no DB needed
  workflow-worker:
    build:
      context: ./workflow-worker
      dockerfile: Dockerfile
    container_name: tempest-workflow-worker
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: tempest
    depends_on:
      temporal:
        condition: service_healthy
    restart: "no"

  # ---------------------------------------------------------------------------
  # Backend Services - API mode (worker disabled)
  # ---------------------------------------------------------------------------

  ims:
    build:
      context: ./ims
      dockerfile: Dockerfile
    container_name: tempest-ims
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USERNAME: tempest
      DB_PASSWORD: tempest
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tempest_ims
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: tempest
      TEMPORAL_WORKER_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: "no"

  oms:
    build:
      context: ./oms
      dockerfile: Dockerfile
    container_name: tempest-oms
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USERNAME: tempest
      DB_PASSWORD: tempest
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tempest_oms
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: tempest
      TEMPORAL_WORKER_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: "no"

  wms:
    build:
      context: ./wms
      dockerfile: Dockerfile
    container_name: tempest-wms
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USERNAME: tempest
      DB_PASSWORD: tempest
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tempest_wms
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: tempest
      TEMPORAL_WORKER_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: "no"

  sms:
    build:
      context: ./sms
      dockerfile: Dockerfile
    container_name: tempest-sms
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USERNAME: tempest
      DB_PASSWORD: tempest
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tempest_sms
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: tempest
      TEMPORAL_WORKER_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8084/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: "no"

  # ---------------------------------------------------------------------------
  # Backend Services - Worker mode (web disabled, activity worker enabled)
  # ---------------------------------------------------------------------------

  ims-worker:
    build:
      context: ./ims
      dockerfile: Dockerfile
    container_name: tempest-ims-worker
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USERNAME: tempest
      DB_PASSWORD: tempest
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tempest_ims
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: tempest
      TEMPORAL_WORKER_ENABLED: "true"
      SPRING_MAIN_WEB-APPLICATION-TYPE: none
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
    restart: "no"

  oms-worker:
    build:
      context: ./oms
      dockerfile: Dockerfile
    container_name: tempest-oms-worker
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USERNAME: tempest
      DB_PASSWORD: tempest
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tempest_oms
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: tempest
      TEMPORAL_WORKER_ENABLED: "true"
      SPRING_MAIN_WEB-APPLICATION-TYPE: none
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
    restart: "no"

  wms-worker:
    build:
      context: ./wms
      dockerfile: Dockerfile
    container_name: tempest-wms-worker
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USERNAME: tempest
      DB_PASSWORD: tempest
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tempest_wms
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: tempest
      TEMPORAL_WORKER_ENABLED: "true"
      SPRING_MAIN_WEB-APPLICATION-TYPE: none
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
    restart: "no"

  sms-worker:
    build:
      context: ./sms
      dockerfile: Dockerfile
    container_name: tempest-sms-worker
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USERNAME: tempest
      DB_PASSWORD: tempest
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tempest_sms
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: tempest
      TEMPORAL_WORKER_ENABLED: "true"
      SPRING_MAIN_WEB-APPLICATION-TYPE: none
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
    restart: "no"

  # ---------------------------------------------------------------------------
  # Frontend
  # ---------------------------------------------------------------------------

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: tempest-ui
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      AUTH_DEV_BYPASS: "true"
      AUTH_SECRET: dev-secret-for-docker-demo
      OMS_URL: http://oms:8082
      IMS_URL: http://ims:8081
      WMS_URL: http://wms:8083
      SMS_URL: http://sms:8084
    depends_on:
      - ims
      - oms
      - wms
      - sms
    restart: "no"

volumes:
  postgres_data:
