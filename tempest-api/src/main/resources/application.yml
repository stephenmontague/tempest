spring:
     application:
          name: tempest-api

     # Single shared database for all domains
     datasource:
          url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tempest}
          username: ${DB_USERNAME}
          password: ${DB_PASSWORD}
          driver-class-name: org.postgresql.Driver

     jpa:
          hibernate:
               ddl-auto: validate
          show-sql: false
          properties:
               hibernate:
                    dialect: org.hibernate.dialect.PostgreSQLDialect
                    format_sql: false

     # tempest-api owns the schema — it runs Flyway; workers only validate.
     flyway:
          enabled: true
          locations: classpath:db/migration
          baseline-on-migrate: true

# Single REST surface for all domains (orders / items / waves / shipments)
server:
     port: 8081
     error:
          # Surface the exception message in error responses so the UI can show the real
          # reason (e.g. validation failures) instead of a generic "Bad Request".
          include-message: always

management:
     endpoints:
          web:
               exposure:
                    include: health,info
     endpoint:
          health:
               show-details: when-authorized
     health:
          db:
               enabled: true
